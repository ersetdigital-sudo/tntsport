name: Deadline Notification

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call deadline notification API
        run: |
          curl -X GET "https://www.tntsportapparel.id/api/admin/deadline-notif?secret=${{ secrets.CRON_SECRET }}"